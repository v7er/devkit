[package]
name = "devkit"
version = "1.0.0"
description = "Local-first developer toolbox"
authors = ["devkit contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "devkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
